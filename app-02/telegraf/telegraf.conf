[agent]
  interval = "15s"
  flush_interval = "15s"
  hostname = "app-02"

[[outputs.prometheus_client]]
  listen = ":9273"

[[inputs.cpu]]
  percpu = false
  totalcpu = true

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "overlay"]

[[inputs.diskio]]

[[inputs.net]]

[[inputs.system]]

[[inputs.nginx]]
  urls = ["http://127.0.0.1:8080/stub_status"]

# NGINX HTTP health check
[[inputs.http_response]]
  urls = ["http://127.0.0.1:8080/stub_status"]
  method = "GET"
  response_timeout = "3s"
  response_status_code = 200

  tagexclude = ["result", "status_code"]
  fieldexclude = ["result_type"]
