groups:
  - name: nginx
    rules:
      - alert: NginxDown
        expr: nginx_up{job="nginx"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Nginx down for {{ $labels.instance }}"
          description: "Nginx exporter reports that Nginx is down"

      - alert: TelegrafNginxDown
        expr: http_response_result_code{job="telegraf",host="app-02"} != 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Nginx down on app-02"
          description: "NGINX HTTP health check failed on app-02"
