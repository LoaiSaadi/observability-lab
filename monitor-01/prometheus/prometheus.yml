global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets:
          - "172.31.4.172:9100"
          - "172.31.33.174:9100"
        labels:
          env: lab

  - job_name: nginx
    static_configs:
      - targets: ["172.31.33.174:9113"]
        labels:
          env: lab

  - job_name: telegraf
    static_configs:
      - targets: ["172.31.41.143:9273"]
        labels:
          env: lab
