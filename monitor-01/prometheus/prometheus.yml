global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
      - targets:
        - "alertmanager:9093"

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets:
          - "172.31.4.172:9100"
          - "172.31.33.174:9100"
        labels:
          env: lab

    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):[0-9]+'
        target_label: host_ip
        replacement: '$1'

  - job_name: nginx
    static_configs:
      - targets: ["172.31.33.174:9113"]
        labels:
          env: lab

    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):[0-9]+'
        target_label: host_ip
        replacement: '$1'

  - job_name: telegraf
    static_configs:
      - targets: ["172.31.41.143:9273"]
        labels:
          env: lab
