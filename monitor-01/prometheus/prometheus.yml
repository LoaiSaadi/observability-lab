global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
      - targets:
        - "alertmanager:9093"
      basic_auth:
        username: alerting
        password_file: /etc/prometheus/alertmanager-password

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    basic_auth:
      username: monitoring
      password_file: /etc/prometheus/scrape-password
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    scheme: https

    tls_config:
      ca_file: /etc/prometheus/monitor-01.crt

    basic_auth:
      username: monitoring
      password_file: /etc/prometheus/monitor-01-password

    static_configs:
      - targets:
          - "172.31.4.172:9100"
        labels:
          env: lab

    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):[0-9]+'
        target_label: host_ip
        replacement: '$1'

  - job_name: node-app01-secure
    scheme: https

    tls_config:
      ca_file: /etc/prometheus/app-01.crt

    basic_auth:
      username: monitoring
      password_file: /etc/prometheus/app-01-password

    static_configs:
      - targets: ["172.31.33.174:9100"]
        labels:
          env: lab

    relabel_configs:
      - target_label: job
        replacement: node
      - source_labels: [__address__]
        regex: '([^:]+):[0-9]+'
        target_label: host_ip
        replacement: '$1'

  - job_name: nginx
    static_configs:
      - targets: ["172.31.33.174:9113"]
        labels:
          env: lab
          host: app-01

    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):[0-9]+'
        target_label: host_ip
        replacement: '$1'

  - job_name: alertmanager
    basic_auth:
      username: alerting
      password_file: /etc/prometheus/alertmanager-password
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: telegraf
    static_configs:
      - targets: ["172.31.41.143:9273"]
        labels:
          env: lab
