auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks

limits_config:
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false

ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules

  rule_path: /loki/ruler-tmp

  alertmanager_url: http://alertmanager:9093

  alertmanager_client:
    basic_auth_username: alerting
    basic_auth_password: "${ALERTMANAGER_BASIC_AUTH_PASSWORD}"

  ring:
    kvstore:
      store: inmemory

  enable_api: true
