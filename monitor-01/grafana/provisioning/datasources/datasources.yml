apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    basicAuth: true
    basicAuthUser: monitoring
    secureJsonData:
      basicAuthPassword: $PROMETHEUS_BASIC_AUTH_PASSWORD

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    basicAuth: true
    basicAuthUser: alerting
    secureJsonData:
      basicAuthPassword: $ALERTMANAGER_BASIC_AUTH_PASSWORD
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
    editable: false
