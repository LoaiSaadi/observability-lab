services:
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    restart: unless-stopped

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/secrets/web.yml:/etc/prometheus/web.yml:ro
      - ./prometheus/secrets/scrape-password:/etc/prometheus/scrape-password:ro
      - ./alertmanager/secrets/client-password:/etc/prometheus/alertmanager-password:ro
      - ./prometheus/secrets/app-01.crt:/etc/prometheus/app-01.crt:ro
      - ./prometheus/secrets/app-01-password:/etc/prometheus/app-01-password:ro
      - ./prometheus/secrets/monitor-01.crt:/etc/prometheus/monitor-01.crt:ro
      - ./prometheus/secrets/monitor-01-password:/etc/prometheus/monitor-01-password:ro

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.config.file=/etc/prometheus/web.yml"

  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?Admin username required}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Admin password required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"

      PROMETHEUS_BASIC_AUTH_PASSWORD: ${PROMETHEUS_BASIC_AUTH_PASSWORD:?Password required}
      ALERTMANAGER_BASIC_AUTH_PASSWORD: ${ALERTMANAGER_BASIC_AUTH_PASSWORD:?Password required}

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.7.9
    container_name: loki
    restart: unless-stopped

    ports:
      - "172.31.4.172:3100:3100"

    environment:
      ALERTMANAGER_BASIC_AUTH_PASSWORD: ${ALERTMANAGER_BASIC_AUTH_PASSWORD:?Password required}

    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
      - ./loki/rules:/etc/loki/rules:ro

    command:
      - "-config.file=/etc/loki/loki.yml"
      - "-config.expand-env=true"

  alertmanager:
    image: prom/alertmanager:v0.34.2
    container_name: alertmanager
    restart: unless-stopped

    ports:
      - "127.0.0.1:9093:9093"

    volumes:
      - alertmanager_data:/alertmanager
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/secrets:/etc/alertmanager/secrets:ro

    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.config.file=/etc/alertmanager/secrets/web.yml"

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  alertmanager_data:
