route:
  receiver: moovingon-stage
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: moovingon-stage
      repeat_interval: 1h

receivers:
  - name: moovingon-stage
    webhook_configs:
      - url: https://api.stage.moovingon.ai/api/pushes/?format=json
        send_resolved: true
        http_config:
          basic_auth:
            username_file: /etc/alertmanager/secrets/moovingon_stage_username
            password_file: /etc/alertmanager/secrets/moovingon_stage_token

inhibit_rules:
  - source_matchers:
      - 'alertname="InstanceDown"'
      - 'job="node"'
      - 'host_ip=~".+"'
    target_matchers:
      - 'alertname="NginxDown"'
      - 'host_ip=~".+"'
    equal:
      - host_ip
